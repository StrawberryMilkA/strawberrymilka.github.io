---
layout: default
title: 联测成绩
active_nav: weekly
extra_head: |
  <style>
    .weekly-container { max-width: 1100px; margin: 0 auto; padding: 120px 24px 80px; }
    .weekly-container h1 { text-align: center; font-size: 2.2rem; margin-bottom: 40px; }
    .exam-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 24px; margin-bottom: 20px; box-shadow: var(--card-shadow); transition: transform 0.2s; display: block; color: inherit; text-decoration: none; }
    .exam-card:hover { transform: translateY(-2px); box-shadow: var(--card-shadow-hover); }
    .exam-card .exam-date { font-size: 0.9rem; color: var(--accent); font-weight: 600; }
    .exam-card h2 { font-size: 1.3rem; margin: 8px 0 10px; color: var(--text); }
    .exam-card .exam-desc { color: var(--text-secondary); line-height: 1.6; font-size: 0.95rem; }
    .pagination { display: flex; justify-content: center; gap: 12px; margin-top: 36px; flex-wrap: wrap; }
    .pagination a, .pagination span { padding: 8px 16px; border-radius: 8px; background: var(--surface-alt); color: var(--text-secondary); text-decoration: none; font-weight: 500; }
    .pagination a:hover { background: var(--accent); color: #fff; }
    .pagination .active { background: var(--accent); color: #fff; font-weight: 700; }
    .pagination .disabled { opacity: 0.5; pointer-events: none; }
    .back-link { display: inline-flex; align-items: center; gap: 8px; margin-top: 32px; color: var(--accent); font-weight: 600; }
    @media (max-width: 600px) {
      .weekly-container { padding: 100px 16px 60px; }
    }
  </style>
---
{% assign exams_sorted = site.exams | sort: "sort_date" | reverse %}

<div class="weekly-container">
  <h1>📋 联测成绩一览</h1>

  <div id="exam-list">
    {% for exam in exams_sorted %}
      <a href="{{ exam.url | relative_url }}" class="exam-card" data-exam-id="{{ forloop.index0 }}">
        <div class="exam-date">{{ exam.date }}</div>
        <h2>{{ exam.title }}</h2>
        <div class="exam-desc">{{ exam.excerpt | strip_html | truncate: 150 }}</div>
      </a>
    {% endfor %}
  </div>

  <nav id="pagination-container" class="pagination"></nav>
  <a href="{{ '/' | relative_url }}" class="back-link">← 返回组织主页</a>
</div>

<script>
  (function() {
    const perPage = 5;
    const cards = Array.from(document.querySelectorAll('#exam-list .exam-card'));
    const paginationContainer = document.getElementById('pagination-container');
    if (!cards.length) {
      if (paginationContainer) paginationContainer.innerHTML = '<span class="pagination-info">暂无联测记录</span>';
      return;
    }

    let currentPage = 1;
    const totalPages = Math.ceil(cards.length / perPage);

    function showPage(page) {
      cards.forEach((card, index) => {
        card.style.display = (index >= (page-1)*perPage && index < page*perPage) ? '' : 'none';
      });
      renderPagination(page);
    }

    function renderPagination(page) {
      let html = '';
      if (page > 1) {
        html += `<a href="#" class="pagination-btn" data-page="${page-1}">← 上一页</a>`;
      } else {
        html += '<span class="pagination-btn disabled">← 上一页</span>';
      }
      html += `<span class="pagination-info">第 ${page} / ${totalPages} 页</span>`;
      if (page < totalPages) {
        html += `<a href="#" class="pagination-btn" data-page="${page+1}">下一页 →</a>`;
      } else {
        html += '<span class="pagination-btn disabled">下一页 →</span>';
      }
      paginationContainer.innerHTML = html;
    }

    paginationContainer.addEventListener('click', function(e) {
      e.preventDefault();
      const btn = e.target.closest('.pagination-btn');
      if (!btn || btn.classList.contains('disabled')) return;
      const page = parseInt(btn.dataset.page);
      if (page >= 1 && page <= totalPages) {
        currentPage = page;
        showPage(page);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    });

    showPage(1);
  })();
</script>
