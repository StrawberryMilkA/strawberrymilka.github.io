---
layout: default
title: 联测成绩
active_nav: weekly
extra_head: |
  <style>
    /* 你的原有样式 */

---
{% assign exams = site.exams | sort: "sort_date" | reverse %}
<div class="weekly-container">
  <h1>联测成绩一览</h1>
  <div id="exam-list">
    {% for exam in exams %}
      <a href="{{ exam.url | relative_url }}" class="exam-card">
        <div class="exam-date">{{ exam.date }}</div>
        <h2>{{ exam.title }}</h2>
        <p>{{ exam.excerpt | strip_html | truncate: 150 }}</p>
      </a>
    {% endfor %}
  </div>
  <nav id="pagination-container" class="pagination"></nav>
</div>

  // 同上逻辑，perPage = 5
</script>
