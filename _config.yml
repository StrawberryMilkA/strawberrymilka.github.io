# 原有部分保持不变
title: 奥本海默组织
description: 集合数学、物理、逻辑学等多学科为一体的综合性学术组织
baseurl: ""
url: "https://abhm.qzz.io"

collections:
  news:
    output: true
    permalink: /news/:name/
  exams:
    output: true
    permalink: /weekly/:name/       # 生成 /weekly/1/ 等
  students:
    output: true
    permalink: /students/:name/    # 生成 /students/100001/ 等

# 原 news 分页保持不变，不需要全局配置 exams 分页（在页面中配置）
pagination:
  enabled: true
  collection: news
  per_page: 2
  sort_field: 'date'
  sort_reverse: true
  filters:
    - field: 'pinned'
      value: false
  trail:
    before: 2
    after: 2